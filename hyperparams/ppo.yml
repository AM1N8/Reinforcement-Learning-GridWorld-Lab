# PPO Hyperparameters for various environments
# Compatible with rl_zoo3 format

LunarLander-v3:
  n_timesteps: !!float 1e6
  policy: 'MlpPolicy'
  n_steps: 1024
  batch_size: 64
  gae_lambda: 0.98
  gamma: 0.999
  n_epochs: 4
  ent_coef: 0.01
  learning_rate: 0.0003
  clip_range: 0.2
  max_grad_norm: 0.5

CartPole-v1:
  n_timesteps: !!float 1e5
  policy: 'MlpPolicy'
  n_steps: 32
  batch_size: 256
  gae_lambda: 0.8
  gamma: 0.98
  n_epochs: 20
  ent_coef: 0.0
  learning_rate: 0.001
  clip_range: 0.2
  max_grad_norm: 0.5

GridWorld-v0:
  n_timesteps: !!float 1e5
  policy: 'MlpPolicy'
  n_steps: 128
  batch_size: 64
  gae_lambda: 0.95
  gamma: 0.99
  n_epochs: 10
  ent_coef: 0.01
  learning_rate: 0.0003
  clip_range: 0.2
  max_grad_norm: 0.5