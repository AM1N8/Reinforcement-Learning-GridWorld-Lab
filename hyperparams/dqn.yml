# DQN Hyperparameters for various environments
# Compatible with rl_zoo3 format

CartPole-v1:
  n_timesteps: !!float 5e4
  policy: 'MlpPolicy'
  learning_rate: 0.001
  buffer_size: 50000
  learning_starts: 1000
  batch_size: 32
  tau: 1.0
  gamma: 0.99
  train_freq: 256
  gradient_steps: 128
  target_update_interval: 10
  exploration_fraction: 0.16
  exploration_final_eps: 0.04
  policy_kwargs: "dict(net_arch=[256, 256])"

LunarLander-v3:
  n_timesteps: !!float 5e5
  policy: 'MlpPolicy'
  learning_rate: 0.00063
  buffer_size: 50000
  learning_starts: 0
  batch_size: 128
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: -1
  target_update_interval: 250
  exploration_fraction: 0.12
  exploration_final_eps: 0.1
  policy_kwargs: "dict(net_arch=[256, 256])"

GridWorld-v0:
  n_timesteps: !!float 1e5
  policy: 'MlpPolicy'
  learning_rate: 0.001
  buffer_size: 10000
  learning_starts: 1000
  batch_size: 32
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 100
  exploration_fraction: 0.2
  exploration_final_eps: 0.05
  policy_kwargs: "dict(net_arch=[64, 64])"